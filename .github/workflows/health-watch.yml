name: health-watch

# v5.77: стор здоровья прода. После «чистки деплоев» вебхук бота остался
# на мёртвом dpl-URL — Telegram шлёт апдейты в никуда, бот молчит.
# Самолечение живёт в /api/health, но его никто не пингует регулярно
# (Vercel cron на Hobby — раз в сутки). Поэтому пингуем оттуда, где кроны
# бесплатны и часты — GitHub Actions (каждые 5 минут).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: health-watch
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (bot webhook self-heal + schema + catalog)
        run: |
          set -o pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 40 \
            "https://tg-swipe.vercel.app/api/health" || echo "000")
          echo "HTTP ${code}"
          cat /tmp/health.json | head -c 600 || true
          echo
          # 200 = ок; 503 (схема/бд) тоже считаем «доехавшим» — health внутри
          # сам запускает лечение. Бьём тревогу только на сеть (000/timeout).
          if [ "$code" = "000" ]; then
            echo "::warning::prod unreachable (network)"
            exit 0
          fi
